<!DOCTYPE html>
<html>
    <head>
        <title>Sonora - A Real-Time Audio Visualizer</title>
        <link rel="icon" type="image/jpeg" href="Sonora Logo.png">
    </head>
    <body>
        <style>

body {
    background-color: #080b16;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 24px;
    color: #e8ecf4;
    font-family: Arial, sans-serif;
}

div {
    display: flex;
    flex-direction: column;
}

.headers {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
}

.brand-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.heading {
    font-size: 32px;
    margin: 0;
}

.tagline {
    font-size: 14px;
    margin: 4px 0 0;
    color: #aab5ca;
}

.logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

.sideHeading {
    font-size: 14px;
    letter-spacing: 2px;
    color: #00f5ff;
}

.hero {
    margin-top: 72px;
}

.hero h2 {
    font-size: 42px;
    margin-bottom: 8px;
}

.hero h3 {
    font-size: 18px;
    font-weight: normal;
    color: #aab5ca;
    margin-top: 0;
}

.canvas {
    display: block;
    max-width: 100%;
    height: auto;
    border: none;
    border-radius: 10px;
}

.visualizerPanel {
    align-self: center;
    margin-top: 24px;
    padding: 16px;
    background-color: #0d1222;
    border: 1px solid #252d46;
    border-radius: 16px;
    box-shadow: 0 0 24px rgba(139, 92, 246, 0.08);
}

.audio {
    align-self: center;
    max-width: 100%;
}

.input {
    align-self: center;
    margin-top: 16px;
    color: #e8ecf4;
    display: none;
}
.control-panel{
    background-color: #0d1222;
    display: flex;
    align-self: center;
    margin-top: 24px;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid #252d46;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
}
.track-title{
    font-size: 12px;
    color: #00f5ff;
    margin-bottom: 5px;
}
.track-name{
    font-size: 14px;
    color: #aab5ca;
    margin-top: 5px;
}
.upload-label{
    background-color: #8b5cf6;
    color: #ffffff;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}
        </style>
<div class="mainDiv">

    <div class="headers">
        <div class="brand">
            <img class="logo" src="Sonora Logo.png" alt="Sonora logo">

            <div class="brand-text">
                <h1 class="heading">Sonora</h1>
                <h3 class="tagline">See the sound. Feel the flow.</h3>
            </div>
        </div>

        <h2 class="sideHeading">REAL-TIME AUDIO</h2>
    </div>

    <div class="hero">
        <h2>Your Sound. Visualised.</h2>
        <h3>Turn your audio into a living spectrum.</h3>
    </div>

</div>

<div class="visualizerPanel">

<canvas width="1000" height="500" class="canvas"></canvas>

</div>

<div class="control-panel">

    <div class="track-info">
        <h3 class="track-title">NOW PLAYING</h3>
        <p class="track-name">Choose an audio file to begin</p>
    </div>

    <div class="playback-controls">
        <audio class="audio" controls></audio>
    </div>

    <div class="upload-section">
        <label class="upload-label" for="audio-file">
            Choose Audio File
        </label>
        <input class="input" id="audio-file" type="file" accept="audio/*">
    </div>

</div>
        <script>
            let input = document.querySelector(".input");
            let audio = document.querySelector(".audio");
            let canvas = document.querySelector(".canvas");
            let width = canvas.width;
            let height = canvas.height;
            let ctx = canvas.getContext("2d");
            let audioContext = new AudioContext;
            let source = audioContext.createMediaElementSource(audio);
            let analyser = audioContext.createAnalyser();
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
            let dataArray = new Uint8Array(analyser.frequencyBinCount);
            let heights = new Array(dataArray.length).fill(0);
            let peaks = new Array(dataArray.length).fill(0);
            let position = 0;
            let t = 0;
            let progress = 0;
            let bassIntensity = 0;
            let glowStrength = 0;
            let trackName = document.querySelector(".track-name");
            function animate(){
                analyser.getByteFrequencyData(dataArray);
                progress = Number.isFinite(audio.duration) && audio.duration > 0
                ? audio.currentTime / audio.duration
                : 0;
                bassIntensity = 0
                for(let i = 0; i < 8; i++){
                    bassIntensity+= dataArray[i];
                   }
                bassIntensity /= 8;
                glowStrength = bassIntensity/255 * 0.2;
                ctx.clearRect(0, 0, width, height);
                let gradient = ctx.createRadialGradient(
                    width / 2, height / 2, 20,
                    width/2, height/2, 770
                );
                gradient.addColorStop(0, `rgba(139, 92, 246, ${glowStrength})`);
                gradient.addColorStop(1, "rgba(0, 245, 255, 0)");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
                for(let i = 0; i < dataArray.length; i++){
                    position = i/(dataArray.length-1);
                    heights[i] += (dataArray[i] - heights[i]) * 0.3;
                    if(heights[i] > peaks[i]){
                        peaks[i] = heights[i];
                    }
                    else{
                        peaks[i] = Math.max(0, peaks[i] - 0.5);
                    }
                    if(position <= 0.5){
                        t = position/0.5;
                        let r = 238 - (238*t);
                        let g = 130 - (130*t);
                        let b = 238 + (17*t);
                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;
                    }
                    else if(position > 0.5 && position <= 1){
                        t = (position - 0.5)/0.5;
                        let r = 0;
                        let g = 0 + (245*t);
                        let b = 255
                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;
                    }
                    ctx.shadowBlur = 15;
                    ctx.fillRect(i * (width/dataArray.length), height - heights[i], (width/dataArray.length) - 5 , heights[i]);
                    ctx.fillStyle = "#e8ecf4";
                    ctx.shadowBlur = 0;
                    ctx.fillRect(i * (width/dataArray.length), height - peaks[i], (width/dataArray.length) - 5, 3);
                    ctx.shadowBlur = 15;
                }
                ctx.beginPath();
                ctx.moveTo(10, height - 10);
                ctx.lineTo(width - 10, height - 10);
                ctx.lineWidth = 2;
                ctx.strokeStyle = `rgba(${0}, ${245}, ${255}, ${0.2})`;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(10, height - 10);
                ctx.lineTo(10 + (width - 20) * progress, height - 10);
                ctx.lineWidth = 2;
                ctx.shadowColor = "#00f5ff";
                ctx.shadowBlur = 10;
                ctx.strokeStyle = "#00f5ff";
                ctx.stroke();
                ctx.shadowBlur = 0;
                requestAnimationFrame(animate);
            }
            animate();
            audio.addEventListener("play", ()=> audioContext.resume());
            input.addEventListener("change", file);
            function file(event){
                let val =  event.target.files[0];
                if(!val) return;
                let audio1 = URL.createObjectURL(val);
                audio.src = audio1;
                trackName.textContent = val.name;
            }
        </script>
    </body>
</html>
